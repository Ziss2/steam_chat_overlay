name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release package
        run: |
          PACKAGE_NAME="steam-chat-overlay"
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION="${VERSION#v}"
          mkdir -p release
          cp -r server public start.bat package.json package-lock.json .env.example config.example.json release/
          cp -r node_modules release/node_modules
          cd release
          zip -r "../${PACKAGE_NAME}-v${VERSION}.zip" .
          cd ..
          tar -czf "${PACKAGE_NAME}-v${VERSION}.tar.gz" -C release .

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
          fi
          PREV_TAG=$(git describe --abbrev=0 --tags ${TAG}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ## Installation
            1. Extract the zip/tar.gz
            2. Run `npm start` or `start.bat`
            3. Open `http://127.0.0.1:4700/config`
          files: |
            steam-chat-overlay-v*.zip
            steam-chat-overlay-v*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      - name: Check package.json
        run: |
          node -e "const p=require('./package.json'); process.exit(!(p.name && p.version && p.main))"
