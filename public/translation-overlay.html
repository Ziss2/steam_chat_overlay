<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Translation Overlay</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--font-family: "Kanit", "Noto Sans Thai", "Segoe UI", sans-serif;
				--font-size: 20px;
				--line-height: 1.4;
				--width: 420px;
				--radius: 12px;
				--gap: 10px;
				--padding: 12px;
				--text-color: #ffffff;
				--original-color: rgba(255, 255, 255, 0.55);
				--twitch-color: #a970ff;
				--youtube-color: #ff4e45;
				--kick-color: #53fc18;
				--tiktok-color: #fe2c55;
				--accent: var(--twitch-color);
				--bg-opacity: 0.75;
				--anim-duration: 260ms;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: transparent;
				overflow: hidden;
				font-family: var(--font-family);
				color: var(--text-color);
			}

			.chat {
				display: flex;
				flex-direction: column;
				gap: var(--gap);
				width: var(--width);
				max-width: 100%;
				height: 100%;
				padding: 6px;
				overflow: hidden;
				font-size: var(--font-size);
				line-height: var(--line-height);
			}

			.chat.dir-top {
				justify-content: flex-start;
			}

			.msg {
				display: flex;
				gap: 10px;
				background: rgba(0, 0, 0, var(--bg-opacity));
				border-radius: var(--radius);
				padding: var(--padding);
				overflow-wrap: anywhere;
				word-break: break-word;
				backdrop-filter: blur(4px);
				border-left: 4px solid var(--accent);
				animation-duration: var(--anim-duration);
				animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
				animation-fill-mode: both;
				animation-name: slide-in;
			}

			.msg[data-platform="twitch"] {
				--accent: var(--twitch-color);
			}

			.msg[data-platform="youtube"] {
				--accent: var(--youtube-color);
			}

			.msg[data-platform="kick"] {
				--accent: var(--kick-color);
			}

			.msg[data-platform="tiktok"] {
				--accent: var(--tiktok-color);
			}

			.content {
				flex: 1 1 auto;
				min-width: 0;
			}

			.head {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				margin-bottom: 4px;
				font-size: 0.82em;
				opacity: 0.85;
			}

			.name {
				font-weight: 600;
				color: var(--accent);
			}

			.original {
				font-size: 0.85em;
				color: var(--original-color);
				margin-bottom: 2px;
				font-style: italic;
			}

			.translated {
				font-weight: 500;
				color: var(--text-color);
			}

			.msg.leaving {
				animation: fade-out 400ms ease forwards;
			}

			@keyframes slide-in {
				from {
					opacity: 0;
					transform: translateX(-20px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			@keyframes fade-out {
				to {
					opacity: 0;
					transform: translateY(-6px);
					filter: blur(2px);
				}
			}
		</style>
	</head>
	<body>
		<main id="chat" class="chat dir-top" aria-live="polite"></main>
		<div id="status" class="conn-status" hidden></div>
		<script type="module" src="/js/translation-overlay.js"></script>
	</body>
</html>
